name: Update GitHub Profile

on:
  workflow_dispatch:

  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch GitHub activity
        run: python scripts/fetch_activity.py

      - name: Build activity SVG
        run: python scripts/build_activity.py

      - name: Commit updated activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/activity.json assets/activity.svg

          if git diff --cached --quiet; then
            echo "No activity changes :v"
            exit 0
          fi

          git commit -m "chore: update profile activity"
          git push